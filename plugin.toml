[plugin]
id = "vrm-workshop"
name = "VRM Workshop"
version = "1.0.0"
description = "Downloads VRM models from the Steam Workshop via DepotDownloaderMod and shows a 3D preview before saving."
author = "megapunk04"
license = "MIT"
call_timeout_secs = 600

[entry]
command = "python"
args = ["-u", "main.py"]
runtimes = ["python"]

[capabilities]
tools = true
ui_contributions = true

[permissions]
